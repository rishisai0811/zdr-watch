name: ZDR watch
on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17; GitHub may delay scheduled runs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zdrwatch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run check (exit 2 = eligibility changes committed)
        id: check
        run: |
          python -m zdrwatch check --site-url "${{ vars.SITE_URL }}" || code=$?
          echo "code=${code:-0}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit data and site
        if: steps.check.outputs.code == '2'
        run: |
          git config user.name "zdrwatch-bot"
          git config user.email "zdrwatch-bot@users.noreply.github.com"
          git add data docs
          git commit -m "ZDR eligibility changes observed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
